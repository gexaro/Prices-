
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173d35">
  <title>Prices | دليل أسعار الأدوية</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f6f2;color:#19352e;font-family:Arial,sans-serif}
    header{background:#173d35;color:white;padding:22px 20px}
    header h2{margin:0;font-size:21px}
    header p{margin:7px 0 0;color:#c5d7ce;font-size:12px}
    main{max-width:750px;margin:auto;padding:22px 16px}
    .welcome{padding:15px 2px 24px}
    .welcome small{color:#b28c56;letter-spacing:2px}
    .welcome h1{font-size:32px;line-height:1.5;margin:10px 0}
    .welcome h1 span{color:#397563}
    .welcome p{color:#78877f;font-size:14px}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .stat{background:white;border:1px solid #e6eae4;border-radius:14px;padding:17px}
    .stat span{font-size:12px;color:#849087}
    .stat strong{display:block;font-size:26px;margin-top:8px}
    .search{margin-top:22px}
    input,select{font:inherit}
    #search{width:100%;padding:15px;border:1px solid #e1e7e0;border-radius:12px;background:white;outline-color:#397563}
    .actions{display:flex;gap:10px;margin-top:12px}
    button{font:inherit;cursor:pointer}
    .add{background:#245b4d;color:white;border:0;border-radius:11px;padding:13px 20px;flex:1}
    .backup{background:#e6eee8;color:#245b4d;border:0;border-radius:11px;padding:13px}
    .section-title{margin:28px 0 13px;font-size:17px}
    #list{display:grid;gap:10px}
    .medicine{background:white;border:1px solid #e6eae4;border-radius:13px;padding:15px;display:flex;justify-content:space-between;gap:10px;align-items:center}
    .medicine h3{margin:0 0 6px;font-size:15px}
    .medicine p{margin:0;color:#859188;font-size:12px}
    .price{color:#245b4d;font-weight:bold;white-space:nowrap}
    .empty{text-align:center;color:#89958d;padding:35px 10px}
    dialog{border:0;border-radius:16px;width:90%;max-width:430px;padding:22px}
    dialog::backdrop{background:#102820aa}
    dialog h2{margin-top:0}
    dialog label{display:block;font-size:13px;margin:13px 0 6px}
    dialog input,dialog select{width:100%;padding:12px;border:1px solid #dce4dc;border-radius:9px;background:white}
    .form-actions{display:flex;gap:10px;margin-top:20px}
    .form-actions button{flex:1;padding:12px;border:0;border-radius:9px}
    .save{background:#245b4d;color:white}
    .cancel{background:#edf0eb;color:#33483d}
    @media(min-width:600px){.welcome h1{font-size:40px}}
  </style>
</head>
<body>
  <header>
    <h2>Prices</h2>
    <p>دليل أدوية الصيدلية وأسعارها</p>
  </header>

  <main>
    <section class="welcome">
      <small>PHARMACY PRICE BOOK</small>
      <h1>أسعار أدويتك،<br><span>بكل سهولة.</span></h1>
      <p>دليلك الخاص للبحث عن الأدوية وإدارة أسعارها.</p>
    </section>

    <section class="stats">
      <div class="stat">
        <span>إجمالي الأدوية</span>
        <strong id="total">0</strong>
      </div>
      <div class="stat">
        <span>التصنيفات</span>
        <strong id="categories">0</strong>
      </div>
    </section>

    <section class="search">
      <input id="search" type="search" placeholder="ابحث عن اسم الدواء أو التركيز...">
      <div class="actions">
        <button class="add" onclick="openForm()">＋ إضافة دواء</button>
        <button class="backup" onclick="backup()">النسخ الاحتياطي</button>
      </div>
    </section>

    <h3 class="section-title">قائمة الأدوية</h3>
    <section id="list"></section>
  </main>

  <dialog id="medicineDialog">
    <form id="medicineForm">
      <h2>إضافة دواء</h2>

      <label>الاسم التجاري</label>
      <input id="name" required placeholder="اسم الدواء">

      <label>الاسم العلمي</label>
      <input id="generic" placeholder="الاسم العلمي">

      <label>التركيز</label>
      <input id="strength" placeholder="مثال: 500 mg">

      <label>الشكل الصيدلاني</label>
      <select id="form">
        <option>أقراص</option>
        <option>كبسولات</option>
        <option>شراب</option>
        <option>معلق</option>
        <option>مرهم</option>
        <option>كريم</option>
        <option>حقن</option>
        <option>أمبولات</option>
        <option>قطرات</option>
        <option>تحاميل</option>
        <option>أخرى</option>
      </select>

      <label>السعر بالدينار العراقي</label>
      <input id="price" type="number" min="0" required placeholder="السعر">

      <label>وحدة السعر</label>
      <select id="unit">
        <option>الشريط</option>
        <option>العبوة</option>
        <option>الأنبوب</option>
        <option>الأمبولة</option>
        <option>القارورة</option>
        <option>القطعة</option>
      </select>

      <div class="form-actions">
        <button type="button" class="cancel" onclick="medicineDialog.close()">إلغاء</button>
        <button type="submit" class="save">حفظ</button>
      </div>
    </form>
  </dialog>

  <script>
    let medicines = JSON.parse(localStorage.getItem("prices") || "[]");

    const units = {
      "أقراص":"الشريط",
      "كبسولات":"الشريط",
      "شراب":"العبوة",
      "معلق":"العبوة",
      "مرهم":"الأنبوب",
      "كريم":"الأنبوب",
      "حقن":"العبوة",
      "أمبولات":"الأمبولة",
      "قطرات":"العبوة",
      "تحاميل":"القطعة"
    };

    form.addEventListener("change", function(e) {
      if(e.target.id === "form") unit.value = units[form.value] || "القطعة";
    });

    function openForm(){
      medicineForm.reset();
      unit.value = "الشريط";
      medicineDialog.showModal();
    }

    medicineForm.addEventListener("submit", function(e){
      e.preventDefault();

      medicines.push({
        id:Date.now(),
        name:name.value.trim(),
        generic:generic.value.trim(),
        strength:strength.value.trim(),
        form:form.value,
        price:Number(price.value),
        unit:unit.value
      });

      localStorage.setItem("prices",JSON.stringify(medicines));
      medicineDialog.close();
      render();
    });

    function render(){
      const query = search.value.toLowerCase();

      const filtered = medicines.filter(m =>
        [m.name,m.generic,m.strength].join(" ").toLowerCase().includes(query)
      );

      total.textContent = medicines.length;
      categories.textContent = new Set(medicines.map(m=>m.form)).size;

      list.innerHTML = "";

      if(!filtered.length){
        list.innerHTML = '<div class="empty">لا توجد أدوية لعرضها حالياً</div>';
        return;
      }

      filtered.forEach(m=>{
        const item = document.createElement("article");
        item.className = "medicine";

        const info = document.createElement("div");
        const title = document.createElement("h3");
        title.textContent = m.name;

        const details = document.createElement("p");
        details.textContent = [m.generic,m.strength,m.form].filter(Boolean).join(" · ");

        info.append(title,details);

        const cost = document.createElement("div");
        cost.className = "price";
        cost.textContent = m.price.toLocaleString("en-US") + " د.ع / " + m.unit;

        item.append(info,cost);
        list.append(item);
      });
    }

    function backup(){
      const blob = new Blob([JSON.stringify(medicines,null,2)],{type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "prices-backup.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    search.addEventListener("input",render);
    render();
  </script>
</body>
</html>
